Light(-1)">❮</button><img id="lightImage" alt=""><button class="next" onclick="stepLight(1)">❯</button><div class="caption" id="lightCaption"></div></div><div class="toast" id="toast"></div><script id="embeddedData" type="application/json">{"titleZh":"三峡大坝","titleEn":"THREE GORGES DAM","introZh":"一条大江，一座大坝，一场关于水与未来的探索。","introEn":"A great river. A remarkable dam. A story of water and the future.","hero":{"id":"p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2009.jpg?width=1400","zh":"三峡大坝实景","en":"Three Gorges Dam photograph","cz":"三峡工程与长江景观","ce":"The Three Gorges project and Yangtze River","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_09.jpg","py":"Sānxiá Dàbà"},"sections":[{"id":"s0","zh":"走近三峡","en":"Meet the Three Gorges Dam","cz":"三峡大坝位于中国湖北省宜昌市附近，横跨长江。它不仅是一座大坝，也是发电、防洪和航运工程的重要组成部分。","ce":"The Three Gorges Dam crosses the Yangtze River near Yichang, Hubei Province. It is part of a major project for electricity generation, flood control and shipping.","qz":"观察大坝横跨河面的形状。","qe":"Look at how the dam stretches across the river.","images":[{"id":"s0p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2009.jpg?width=1400","zh":"三峡大坝","en":"Three Gorges Dam","cz":"观察大坝横跨河面的形状。","ce":"Look at how the dam stretches across the river.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_09.jpg","py":"Sānxiá Dàbà"},{"id":"s0p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/ThreeGorgesDam-China2009.jpg?width=1400","zh":"长江上的大坝","en":"Dam on the Yangtze River","cz":"走近三峡：三峡大坝位于中国湖北省宜昌市附近，横跨长江。","ce":"Meet the Three Gorges Dam. The Three Gorges Dam crosses the Yangtze River near Yichang, Hubei Province.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Le Grand Portage / Rehman · CC BY 2.0","source":"https://commons.wikimedia.org/wiki/File:ThreeGorgesDam-China2009.jpg","py":"Cháng Jiāng shàng de dàbà"}]},{"id":"s1","zh":"长江与三峡","en":"The Yangtze and Three Gorges","cz":"长江是中国最长的河流。三峡指瞿塘峡、巫峡和西陵峡，三峡大坝位于西陵峡东部附近。","ce":"The Yangtze is China’s longest river. The Three Gorges are Qutang Gorge, Wu Gorge and Xiling Gorge. The dam stands near the eastern end of Xiling Gorge.","qz":"“江”是 river 的意思。","qe":"The character 江 means river.","images":[{"id":"s1p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/ThreeGorgesDam-China2009.jpg?width=1400","zh":"长江","en":"Yangtze River","cz":"“江”是 river 的意思。","ce":"The character 江 means river.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Le Grand Portage / Rehman · CC BY 2.0","source":"https://commons.wikimedia.org/wiki/File:ThreeGorgesDam-China2009.jpg","py":"Cháng Jiāng"},{"id":"s1p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20October%202016.jpg?width=1400","zh":"三峡风光","en":"Scenery of the Three Gorges","cz":"长江与三峡：长江是中国最长的河流。","ce":"The Yangtze and Three Gorges. The Yangtze is China’s longest river.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fredlyfish4 · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_October_2016.jpg","py":"Sānxiá fēngguāng"}]},{"id":"s2","zh":"建造时间线","en":"A Timeline of Construction","cz":"三峡工程于1994年正式开工，2006年大坝主体工程完成，2012年地下电站最后一台机组投产。这样的大工程需要多年建设。","ce":"Construction began in 1994. The main dam structure was completed in 2006, and the final underground power-generating unit entered service in 2012. Building a project this large takes many years.","qz":"1994、2006、2012：你能按顺序读出这些年份吗？","qe":"Can you say these three years in order: 1994, 2006, 2012?","images":[{"id":"s2p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20October%202016.jpg?width=1400","zh":"三峡工程","en":"Three Gorges Project","cz":"1994、2006、2012：你能按顺序读出这些年份吗？","ce":"Can you say these three years in order: 1994, 2006, 2012?","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fredlyfish4 · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_October_2016.jpg","py":"Sānxiá Gōngchéng"},{"id":"s2p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20-%20panoramio.jpg?width=1400","zh":"大坝建设","en":"Dam construction","cz":"建造时间线：三峡工程于1994年正式开工，2006年大坝主体工程完成，2012年地下电站最后一台机组投产。","ce":"A Timeline of Construction. Construction began in 1994.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Raki_Man · CC BY 3.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_-_panoramio.jpg","py":"Dàbà jiànshè"}]},{"id":"s3","zh":"大坝有多大","en":"How Big Is the Dam?","cz":"大坝坝顶长约2,335米，坝顶高程为185米。注意：“185米”是坝顶的海拔高程，不是大坝从底部到顶部的高度。","ce":"The dam is about 2,335 metres long along its crest. Its crest elevation is 185 metres above sea level. That does not mean the structure is 185 metres tall from its base.","qz":"你能在图片中找到坝顶吗？","qe":"Can you find the top of the dam in the photo?","images":[{"id":"s3p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20-%20panoramio.jpg?width=1400","zh":"坝体结构","en":"Dam structure","cz":"你能在图片中找到坝顶吗？","ce":"Can you find the top of the dam in the photo?","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Raki_Man · CC BY 3.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_-_panoramio.jpg","py":"Bàtǐ jiégòu"},{"id":"s3p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2012.jpg?width=1400","zh":"水利工程","en":"Water conservancy project","cz":"大坝有多大：大坝坝顶长约2,335米，坝顶高程为185米。","ce":"How Big Is the Dam?. The dam is about 2,335 metres long along its crest.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_12.jpg","py":"Shuǐlì gōngchéng"}]},{"id":"s4","zh":"水力发电","en":"Power from Water","cz":"水从高处流向低处，推动水轮机旋转，发电机把运动转化成电能。三峡电站装机容量为22,500兆瓦。","ce":"Flowing water turns turbines, which drive generators to make electricity. The Three Gorges power station has an installed generating capacity of 22,500 megawatts.","qz":"水 → 水轮机 → 发电机 → 电。","qe":"Water → turbine → generator → electricity.","images":[{"id":"s4p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2012.jpg?width=1400","zh":"水力发电","en":"Hydropower","cz":"水 → 水轮机 → 发电机 → 电。","ce":"Water → turbine → generator → electricity.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_12.jpg","py":"Shuǐlì fādiàn"},{"id":"s4p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2009.jpg?width=1400","zh":"清洁能源","en":"Clean energy","cz":"水力发电：水从高处流向低处，推动水轮机旋转，发电机把运动转化成电能。","ce":"Power from Water. Flowing water turns turbines, which drive generators to make electricity.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_09.jpg","py":"Qīngjié néngyuán"}]},{"id":"s5","zh":"防洪与蓄水","en":"Flood Control and Storage","cz":"三峡水库可以在汛期储存一部分洪水，帮助降低下游洪水风险。但防洪仍需要天气预报、河流管理和其他设施共同配合。","ce":"During flood season, the reservoir can hold back some floodwater and help reduce downstream flood risk. Forecasting and other flood-control measures are still important.","qz":"水库为什么不能一直装满水？","qe":"Why might a reservoir need space for floodwater?","images":[{"id":"s5p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20in%202021%2009.jpg?width=1400","zh":"防洪工程","en":"Flood-control project","cz":"水库为什么不能一直装满水？","ce":"Why might a reservoir need space for floodwater?","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fxqf · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_in_2021_09.jpg","py":"Fánghóng gōngchéng"},{"id":"s5p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/ThreeGorgesDam-China2009.jpg?width=1400","zh":"三峡水库","en":"Three Gorges Reservoir","cz":"防洪与蓄水：三峡水库可以在汛期储存一部分洪水，帮助降低下游洪水风险。","ce":"Flood Control and Storage. During flood season, the reservoir can hold back some floodwater and help reduce downstream flood risk.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Le Grand Portage / Rehman · CC BY 2.0","source":"https://commons.wikimedia.org/wiki/File:ThreeGorgesDam-China2009.jpg","py":"Sānxiá Shuǐkù"}]},{"id":"s6","zh":"船怎样过坝","en":"How Do Ships Pass?","cz":"三峡工程设有五级船闸和升船机。船闸通过改变水位，让船逐级通过；升船机则像给船乘坐的“电梯”。","ce":"The project has a five-stage ship lock and a ship lift. Locks raise or lower boats in steps by changing the water level. The ship lift works rather like an elevator for boats.","qz":"想象你是一艘船：你会选船闸还是升船机？","qe":"Imagine you are on a boat: would you choose the locks or the lift?","images":[{"id":"s6p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/ThreeGorgesDam-China2009.jpg?width=1400","zh":"长江航运","en":"Yangtze River shipping","cz":"想象你是一艘船：你会选船闸还是升船机？","ce":"Imagine you are on a boat: would you choose the locks or the lift?","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Le Grand Portage / Rehman · CC BY 2.0","source":"https://commons.wikimedia.org/wiki/File:ThreeGorgesDam-China2009.jpg","py":"Cháng Jiāng hángyùn"},{"id":"s6p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20October%202016.jpg?width=1400","zh":"三峡船闸","en":"Three Gorges ship locks","cz":"船怎样过坝：三峡工程设有五级船闸和升船机。","ce":"How Do Ships Pass?. The project has a five-stage ship lock and a ship lift.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fredlyfish4 · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_October_2016.jpg","py":"Sānxiá chuánzhá"}]},{"id":"s7","zh":"工程与人们","en":"People and the Environment","cz":"三峡工程带来了电力和航运等益处，也改变了河流生态环境，并涉及大量居民搬迁。认识大型工程，需要同时了解它的贡献和代价。","ce":"The project brings benefits such as electricity and improved navigation. It has also changed river ecosystems and required large-scale resettlement. Understanding big projects means considering both benefits and costs.","qz":"一个大型工程应该怎样照顾环境和居民？","qe":"How should a large project protect nature and communities?","images":[{"id":"s7p0","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20October%202016.jpg?width=1400","zh":"人与长江","en":"People and the Yangtze","cz":"一个大型工程应该怎样照顾环境和居民？","ce":"How should a large project protect nature and communities?","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Fredlyfish4 · CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_October_2016.jpg","py":"Rén yǔ Cháng Jiāng"},{"id":"s7p1","src":"https://commons.wikimedia.org/wiki/Special:FilePath/Three%20Gorges%20Dam%20-%20panoramio.jpg?width=1400","zh":"现代中国工程","en":"Modern Chinese engineering","cz":"工程与人们：三峡工程带来了电力和航运等益处，也改变了河流生态环境，并涉及大量居民搬迁。","ce":"People and the Environment. The project brings benefits such as electricity and improved navigation.","az":"三峡大坝照片","ae":"Photo of Three Gorges Dam","ratio":"16/9","pos":"50% 50%","credit":"Raki_Man · CC BY 3.0","source":"https://commons.wikimedia.org/wiki/File:Three_Gorges_Dam_-_panoramio.jpg","py":"Xiàndài Zhōngguó gōngchéng"}]}],"quiz":[{"qz":"三峡大坝建在哪条河上？","qe":"Which river is the dam on?","oz":["长江","黄河","珠江"],"oe":["Yangtze River","Yellow River","Pearl River"],"answer":0,"ez":"大坝横跨长江。","ee":"The dam crosses the Yangtze."},{"qz":"三峡工程哪一年正式开工？","qe":"When did construction begin?","oz":["1994年","2006年","2012年"],"oe":["1994","2006","2012"],"answer":0,"ez":"1994年正式开工。","ee":"Construction began in 1994."},{"qz":"水力发电主要利用什么？","qe":"What powers the turbines?","oz":["流动的水","阳光","风"],"oe":["Moving water","Sunlight","Wind"],"answer":0,"ez":"流动的水推动水轮机。","ee":"Moving water turns turbines."},{"qz":"船怎样通过大坝？","qe":"How can boats pass the dam?","oz":["船闸或升船机","飞机","隧道"],"oe":["Locks or ship lift","Airplane","Tunnel"],"answer":0,"ez":"船闸和升船机帮助船通行。","ee":"Locks and the ship lift help boats pass."},{"qz":"三峡水库可以帮助什么？","qe":"What can the reservoir help with?","oz":["防洪","制造台风","停止降雨"],"oe":["Flood control","Creating typhoons","Stopping rain"],"answer":0,"ez":"水库可以储存部分洪水。","ee":"The reservoir can store some floodwater."},{"qz":"关于大坝，哪句话更全面？","qe":"Which statement is more balanced?","oz":["既有益处也有影响","只有益处","没有任何作用"],"oe":["It has benefits and impacts","Only benefits","No effect"],"answer":0,"ez":"工程同时影响社会与环境。","ee":"The project affects both people and nature."}]}</script><script>
let data=JSON.parse(document.getElementById('embeddedData').textContent),defaults=JSON.parse(JSON.stringify(data));let lang='bi',editing=false,db=null,lightIndex=0,lightPhotos=[],current=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const L=(z,e)=>lang==='zh'?esc(z):lang==='en'?esc(e):`<span class="inline-zh">${esc(z)}</span><span class="inline-en" style="display:block;opacity:.75;margin-top:7px">${esc(e)}</span>`;function msg(z,e){$('#toast').textContent=lang==='en'?e:z+' / '+e;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}function imgTag(p){return `<img loading="lazy" src="${esc(p.src)}" alt="${esc(lang==='en'?p.ae:p.az)}" style="object-fit:cover;object-position:${esc(p.pos||'50% 50%')}" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div class=failed>图片暂时无法显示 / Image unavailable</div>')">`}
function render(){const hero=data.hero;$('#app').innerHTML=`<section class="hero">${imgTag(hero)}<div class="intro"><div class="eyebrow">CHINA · YANGTZE RIVER · 中国长江</div><h1>${L(data.titleZh,data.titleEn)}</h1><p>${L(data.introZh,data.introEn)}</p><button onclick="$('#explore').scrollIntoView()">${lang==='en'?'Start Exploring':'开始探索 / Explore'} ↗</button><button class="editPhoto" onclick="openPhoto('hero')">✎ ${lang==='en'?'Replace cover':'替换封面'}</button></div></section><div class="metrics"><div class="metric"><b>2,335 m</b><span>${L('坝顶长度','Crest length')}</span></div><div class="metric"><b>22,500 MW</b><span>${L('装机容量','Installed capacity')}</span></div><div class="metric"><b>1994</b><span>${L('正式开工','Construction began')}</span></div></div><div id="explore">${data.sections.map((s,i)=>`<section class="section" id="${s.id}"><div class="inner"><div class="copy"><div class="num">CHAPTER ${String(i+1).padStart(2,'0')}</div><h2>${L(s.zh,s.en)}</h2><p>${L(s.cz,s.ce)}</p><div class="question">✦ ${L(s.qz,s.qe)}</div>${editing?`<p><button onclick="editSection(${i})">✎ 编辑本章文字 / Edit text</button> <button onclick="addImages(${i})">＋ 添加图片 / Add</button></p>`:''}</div><div class="gallery">${s.images.map((p,j)=>`<figure class="photo" style="aspect-ratio:${esc(p.ratio||'16/9')}">${imgTag(p)}<figcaption><span class="photo-name">${esc(p.zh)}</span><span class="photo-pinyin">${esc(p.py||'')}</span><span class="photo-english">${esc(p.en)}</span><div class="photo-description">${L(p.cz,p.ce)}</div></figcaption><button class="editPhoto" onclick="openPhoto('${s.id}',${j})">✎ 替换 / Replace</button><span style="position:absolute;inset:0;cursor:zoom-in" onclick="openLight('${s.id}',${j})"></span></figure>`).join('')}</div></div></section>`).join('')}</div><section class="facts"><div class="wrap"><div class="eyebrow">DID YOU KNOW? · 你知道吗？</div><h2>${L('三个值得记住的数字','Three Numbers to Remember')}</h2><div class="factgrid"><div class="fact"><b>5</b><p>${L('船闸共有五级。','The ship locks have five stages.')}</p></div><div class="fact"><b>185 m</b><p>${L('坝顶海拔高程，不是坝体高度。','Crest elevation above sea level, not dam height.')}</p></div><div class="fact"><b>2012</b><p>${L('地下电站最后一台机组投产。','The final underground generating unit entered service.')}</p></div></div></div></section><section class="quiz" id="quiz"><div class="eyebrow">TEST YOUR KNOWLEDGE</div><h2>${L('三峡知识挑战','Three Gorges Challenge')}</h2><p>${L('选择答案，然后提交查看解析。','Choose an answer, then submit to see your score.')}</p><div id="quizbody"></div><p><button onclick="submitQuiz()">${lang==='en'?'Submit answers':'提交答案 / Submit'}</button> <button onclick="resetQuiz()">${lang==='en'?'Try again':'重新作答 / Retry'}</button></p><div id="result" aria-live="polite"></div></section>`;document.body.classList.toggle('editing',editing);renderQuiz()}
let answers={},submitted=false;function renderQuiz(){let holder=$('#quizbody');holder.innerHTML=data.quiz.map((q,i)=>`<div class="quizitem"><h3>${i+1}. ${L(q.qz,q.qe)}</h3><div class="choices">${q.oz.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${answers[i]===j?'checked':''} onchange="answers[${i}]=${j}"> ${L(o,q.oe[j])}</label>`).join('')}</div>${submitted?`<div class="feedback">${answers[i]===q.answer?'✓':'✗'} ${L(q.ez,q.ee)}</div>`:''}</div>`).join('');$('#result').innerHTML=submitted?`<div class="feedback"><strong>${L('正确','Correct')}: ${data.quiz.filter((q,i)=>answers[i]===q.answer).length} / ${data.quiz.length}</strong></div>`:''}function submitQuiz(){if(Object.keys(answers).length<data.quiz.length){msg('请先完成所有题目','Please answer all questions');return}submitted=true;renderQuiz()}function resetQuiz(){answers={};submitted=false;renderQuiz()}
function setLang(v){lang=v;document.body.dataset.lang=v;localStorage.setItem('tg_lang',v);render();if($('#modal').classList.contains('show'))openManager()}function toggleEdit(){editing=!editing;render();msg(editing?'已进入编辑模式':'已退出编辑模式',editing?'Edit mode enabled':'View mode enabled')}function closeModal(){$('#modal').classList.remove('show')}function modal(h){$('#panel').innerHTML=h;$('#modal').classList.add('show')}function photoRef(section,index){return section==='hero'?data.hero:data.sections.find(s=>s.id===section)?.images[index]}function allPhotos(){return [{section:'hero',index:0,p:data.hero},...data.sections.flatMap(s=>s.images.map((p,i)=>({section:s.id,index:i,p})))]}
function openManager(){const groups=[{name:'封面 / Cover',section:'hero',images:[data.hero]},...data.sections.map(s=>({name:s.zh+' / '+s.en,section:s.id,images:s.images}))];modal(`<div class="line" style="justify-content:space-between"><h2>图片与内容管理 / Image Manager</h2><button onclick="closeModal()">✕</button></div><p>点击现有图片下的“直接替换”即可用本地照片覆盖原图，不会新增照片。<br>Choose <b>Replace existing</b> to overwrite the selected photo.</p><div class="line"><button onclick="editSection(-1)">编辑主题文字 / Edit title</button><button onclick="exportHTML()">导出完整网页 / Export HTML</button><button onclick="exportJSON()">备份 JSON</button><button onclick="$('#importFile').click()">导入 JSON</button><input id="importFile" type="file" accept="application/json" hidden onchange="importJSON(this)"><button class="danger" onclick="restore()">恢复默认 / Restore</button></div>${groups.map(g=>`<h3>${esc(g.name)}</h3><div class="thumbs">${g.images.map((p,i)=>`<div class="thumb"><img src="${esc(p.src)}" onerror="this.alt='Image unavailable'"><div>${esc(p.zh)}</div><button onclick="openPhoto('${g.section}',${i})">直接替换 / Replace</button>${g.section!=='hero'?`<button onclick="deletePhoto('${g.section}',${i})">删除 / Delete</button>`:''}</div>`).join('')}</div>${g.section!=='hero'?`<p><button onclick="addImages(${data.sections.findIndex(s=>s.id===g.section)})">＋ 添加图片 / Add Image</button></p>`:''}`).join('')}<hr><div class="credit">图片版权信息 / Photo credits: ${allPhotos().map(x=>x.p.credit?esc(x.p.credit):'').filter(Boolean).join('; ')}. <a href="https://commons.wikimedia.org" target="_blank">Wikimedia Commons</a>. Uploaded photos are supplied by the user.</div>`)}
function openPhoto(section,index=0){current={section,index};const p=photoRef(section,index);if(!p)return;modal(`<div class="line" style="justify-content:space-between"><h2>直接替换现有图片 / Replace Existing Photo</h2><button onclick="openManager()">← 返回 / Back</button></div><img class="preview" id="photoPreview" src="${esc(p.src)}" alt="Preview"><label>上传本地照片（直接覆盖这张图片） / Upload local photo to replace this exact image<input type="file" accept="image/*" onchange="replaceFile(this)"></label><label>或输入 HTTPS 图片地址 / Or HTTPS image URL<input id="photoURL" value="${esc(p.src.startsWith('data:')?'':p.src)}"></label><button onclick="replaceURL()">使用此网址替换 / Replace by URL</button><div class="line"><label style="flex:1">中文标题<input id="pzh" value="${esc(p.zh)}"></label><label style="flex:1">拼音 / Pinyin<input id="ppy" value="${esc(p.py||'')}" placeholder="Sānxiá Dàbà"></label><label style="flex:1">English title<input id="pen" value="${esc(p.en)}"></label></div><div class="line"><label style="flex:1">中文说明<textarea id="pcz">${esc(p.cz)}</textarea></label><label style="flex:1">English caption<textarea id="pce">${esc(p.ce)}</textarea></label></div><div class="line"><label style="flex:1">中文替代文本<input id="paz" value="${esc(p.az)}"></label><label style="flex:1">English alt text<input id="pae" value="${esc(p.ae)}"></label></div><div class="line"><label>展示比例 / Aspect ratio<select id="pratio">${['auto','16/9','4/3','1/1','3/4'].map(x=>`<option ${p.ratio===x?'selected':''}>${x}</option>`).join('')}</select></label><label>水平裁切 / Horizontal position<input type="range" id="px" min="0" max="100" value="${parseInt(p.pos)||50}" oninput="previewPos()"></label><label>垂直裁切 / Vertical position<input type="range" id="py" min="0" max="100" value="${parseInt((p.pos||'50% 50%').split(' ')[1])||50}" oninput="previewPos()"></label></div><div class="line"><button onclick="savePhotoMeta()">保存说明与裁切 / Save</button>${section!=='hero'?`<button onclick="movePhoto(-1)">← 前移</button><button onclick="movePhoto(1)">后移 →</button><button onclick="setCover()">设为封面 / Set as cover</button><button class="danger" onclick="deletePhoto('${section}',${index})">删除 / Delete</button>`:''}</div><small>更换图片后立即生效并自动保存；导出 HTML 后可分享给其他设备。 / Replacement is immediate; export HTML to share changes.</small>`)}
function previewPos(){$('#photoPreview').style.objectPosition=$('#px').value+'% '+$('#py').value+'%'}function savePhotoMeta(){let p=photoRef(current.section,current.index);Object.assign(p,{zh:$('#pzh').value,py:$('#ppy').value,en:$('#pen').value,cz:$('#pcz').value,ce:$('#pce').value,az:$('#paz').value,ae:$('#pae').value,ratio:$('#pratio').value,pos:$('#px').value+'% '+$('#py').value+'%'});save();render();msg('图片说明已保存','Photo details saved')}
function compress(file){return new Promise((resolve,reject)=>{if(file.size>35e6)return reject(Error('File too large'));let reader=new FileReader;reader.onerror=()=>reject(Error('Read failed'));reader.onload=()=>{let image=new Image;image.onerror=()=>reject(Error('Invalid image'));image.onload=()=>{let max=1800,scale=Math.min(1,max/Math.max(image.width,image.height)),c=document.createElement('canvas');c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};image.src=reader.result};reader.readAsDataURL(file)})}
async function replaceFile(input){let f=input.files[0];if(!f)return;try{let url=await compress(f),p=photoRef(current.section,current.index);p.src=url;p.credit='';p.source='';await save();render();openPhoto(current.section,current.index);msg('原图已直接替换','Existing photo replaced')}catch(e){msg('图片处理失败：'+e.message,'Image failed: '+e.message)}}function replaceURL(){let url=$('#photoURL').value.trim();if(!/^https:\/\//i.test(url)){msg('请输入 HTTPS 图片网址','Use an HTTPS image URL');return}let p=photoRef(current.section,current.index);p.src=url;p.credit='';p.source='';save();render();openPhoto(current.section,current.index);msg('已替换图片网址（需联网）','URL replaced (internet required)')}
function deletePhoto(s,i){if(!confirm(lang==='en'?'Delete this photo?':'确定删除这张照片？'))return;data.sections.find(x=>x.id===s).images.splice(i,1);save();render();openManager();msg('已删除','Deleted')}function movePhoto(d){let s=data.sections.find(x=>x.id===current.section),i=current.index,j=i+d;if(j<0||j>=s.images.length)return;[s.images[i],s.images[j]]=[s.images[j],s.images[i]];save();render();openPhoto(current.section,j)}function setCover(){data.hero=JSON.parse(JSON.stringify(photoRef(current.section,current.index)));save();render();msg('已设为封面','Cover updated')}
function addImages(i){current={add:i};modal(`<h2>添加照片 / Add Photos</h2><p>新增图片不会替换原图。若要替换，请返回图片管理界面选择“直接替换”。</p><label>选择多张本地图片 / Select multiple images<input type="file" multiple accept="image/*" onchange="appendFiles(this)"></label><label>或 HTTPS 地址 / HTTPS URL<input id="newURL" placeholder="https://..."></label><button onclick="appendURL()">添加网址 / Add URL</button> <button onclick="openManager()">返回 / Back</button>`)}async function appendFiles(input){let s=data.sections[current.add];for(let f of input.files){try{s.images.push({id:'user'+Date.now()+Math.random(),src:await compress(f),zh:'新照片',py:'Xīn zhàopiàn',en:'New photo',cz:'',ce:'',az:'照片',ae:'Photo',ratio:'16/9',pos:'50% 50%',credit:''})}catch(e){msg('上传失败 '+e.message,'Upload failed '+e.message)}}await save();render();openManager();msg('照片已添加','Photos added')}function appendURL(){let u=$('#newURL').value.trim();if(!/^https:\/\//.test(u)){msg('请输入 HTTPS 地址','HTTPS URL required');return}data.sections[current.add].images.push({id:'user'+Date.now(),src:u,zh:'新照片',py:'Xīn zhàopiàn',en:'New photo',cz:'',ce:'',az:'照片',ae:'Photo',ratio:'16/9',pos:'50% 50%',credit:''});save();render();openManager()}
function editSection(i){let s=i===-1?data:data.sections[i];modal(`<h2>编辑文字 / Edit Text</h2>${(i===-1?[['titleZh','中文标题'],['titleEn','English title'],['introZh','中文介绍'],['introEn','English introduction']]:[['zh','中文标题'],['en','English title'],['cz','中文正文'],['ce','English text'],['qz','中文观察问题'],['qe','English observation']]).map(([key,label])=>`<label>${label}<textarea data-key="${key}">${esc(s[key])}</textarea></label>`).join('')}<button onclick="saveSection(${i})">保存 / Save</button> <button onclick="openManager()">返回 / Back</button>`)}function saveSection(i){let s=i===-1?data:data.sections[i];document.querySelectorAll('[data-key]').forEach(el=>s[el.dataset.key]=el.value);save();render();msg('文字已保存','Text saved');closeModal()}
function openLight(section,index){lightPhotos=section==='hero'?[data.hero]:data.sections.find(s=>s.id===section).images;lightIndex=index;drawLight();$('#lightbox').classList.add('show')}function drawLight(){let p=lightPhotos[lightIndex];$('#lightImage').src=p.src;$('#lightCaption').textContent=(p.zh||'')+'  ·  '+(p.py||'')+'  ·  '+(p.en||'')}function stepLight(d){lightIndex=(lightIndex+d+lightPhotos.length)%lightPhotos.length;drawLight()}function closeLightbox(){$('#lightbox').classList.remove('show')}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLightbox();closeModal()}if($('#lightbox').classList.contains('show')){if(e.key==='ArrowLeft')stepLight(-1);if(e.key==='ArrowRight')stepLight(1)}});
function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}function safeJSON(obj){return JSON.stringify(obj).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026')}function exportHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#embeddedData').textContent=safeJSON(data);clone.querySelector('#modal').classList.remove('show');clone.querySelector('#lightbox').classList.remove('show');clone.querySelector('body').classList.remove('editing');clone.querySelector('#app').innerHTML='';clone.querySelector('#panel').innerHTML='';let content='<!doctype html>\n'+clone.outerHTML;download('三峡大坝-互动展览-已编辑.html',content,'text/html;charset=utf-8');msg('完整网页已导出','Full website exported')}function exportJSON(){download('三峡大坝-图片与内容备份.json',JSON.stringify(data,null,2),'application/json')}async function importJSON(input){let f=input.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.sections||!x.hero||!x.quiz)throw Error('Invalid format');data=x;await save();render();openManager();msg('已导入','Imported')}catch(e){msg('导入失败','Import failed')}}async function restore(){if(!confirm('恢复初始图片和内容？此操作会覆盖当前编辑。 / Restore defaults?'))return;data=JSON.parse(JSON.stringify(defaults));await save();render();openManager();msg('已恢复默认','Defaults restored')}
async function initDB(){return new Promise(resolve=>{try{let r=indexedDB.open('three-gorges-'+String(document.getElementById('embeddedData').textContent.length)+'-'+String(document.getElementById('embeddedData').textContent.charCodeAt(100)),1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>resolve()}catch(e){resolve()}})}async function save(){if(!db){msg('浏览器无法自动保存，请导出 HTML','Auto-save unavailable; export HTML');return}return new Promise(resolve=>{try{let t=db.transaction('state','readwrite'),r=t.objectStore('state').put(data,'page');r.onsuccess=()=>resolve();r.onerror=()=>{msg('本地保存失败','Local save failed');resolve()}}catch(e){resolve()}})}async function load(){if(!db)return;return new Promise(resolve=>{let r=db.transaction('state').objectStore('state').get('page');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve()})} (async()=>{lang=localStorage.getItem('tg_lang')||'bi';if(!['zh','en','bi'].includes(lang))lang='bi';$('#language').value=lang;document.body.dataset.lang=lang;await initDB();/* Exported HTML embeds authoritative data; use browser saves only for the original template. */let embedded=document.getElementById('embeddedData').textContent;let saved=await load();if(saved&&saved.sections)data=saved;render()})();
</script></body></html>
